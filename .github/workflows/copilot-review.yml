name: Copilot Review on Push

on:
  push:
    branches: [gbrain-cn]

permissions:
  contents: read
  pull-requests: write

jobs:
  ensure-ready-for-review:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure open PR is non-draft (triggers Copilot auto-review)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Copilot auto-review fires when commits land on a non-draft open PR.
          # This step converts draft → ready-for-review so Copilot picks up
          # every push without needing the collaborator API.
          PR_JSON=$(gh pr list \
            --repo "${REPO}" \
            --head gbrain-cn \
            --state open \
            --json number,isDraft \
            --jq '.[0]')

          if [ -z "$PR_JSON" ] || [ "$PR_JSON" = "null" ]; then
            echo "No open PR for gbrain-cn — skipping. Create one manually when ready."
            exit 0
          fi

          PR_NUMBER=$(echo "$PR_JSON" | jq -r '.number')
          IS_DRAFT=$(echo "$PR_JSON" | jq -r '.isDraft')

          echo "PR #${PR_NUMBER}, draft=${IS_DRAFT}"

          if [ "$IS_DRAFT" = "true" ]; then
            echo "Converting draft → ready for review (triggers Copilot)..."
            gh api graphql -f query="
              mutation {
                markPullRequestReadyForReview(input: {pullRequestId: \"$(
                  gh api repos/${REPO}/pulls/${PR_NUMBER} --jq .node_id
                )\"}) {
                  pullRequest { isDraft }
                }
              }"
          else
            echo "PR #${PR_NUMBER} is already ready for review — Copilot reviews on sync."
          fi
