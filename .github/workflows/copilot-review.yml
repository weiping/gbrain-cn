name: Copilot PR Review

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Request Copilot review with specific model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Copilot API — request a code review on this PR
          # Model options: gpt-4o | claude-3-5-sonnet | claude-3-7-sonnet | gemini-1.5-pro
          # Docs: https://docs.github.com/en/rest/copilot

          PR_NUMBER=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            -f body="Copilot review requested" \
            -f event="COMMENT" \
            || echo "Review request submitted (API availability depends on your Copilot plan)"
