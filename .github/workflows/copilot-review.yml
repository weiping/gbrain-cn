name: Copilot Auto Review

# Push to gbrain-cn → ensure PR exists → request Copilot review
on:
  push:
    branches: [gbrain-cn]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Ensure PR exists, then request Copilot review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ── 1. Find or create PR ──────────────────────────────────────
          PR_NUMBER=$(gh pr list \
            --head gbrain-cn \
            --base master \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            COMMIT_MSG=$(git log -1 --pretty=format '%s' HEAD)
            PR_NUMBER=$(gh pr create \
              --base master \
              --head gbrain-cn \
              --title "${COMMIT_MSG:-feat(gbrain-cn): changes}" \
              --draft \
              --body "Auto-created for Copilot review.

Commit: \`${{ github.sha }}\`
Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --json number \
              --jq '.number')
            echo "Created PR #${PR_NUMBER}"
          else
            echo "PR #${PR_NUMBER} already exists"
          fi

          # ── 2. Request Copilot as reviewer ────────────────────────────
          # Copilot bot reviewer: copilot-pull-request-reviewer[bot]
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f "reviewers[]=copilot-pull-request-reviewer" \
            && echo "Copilot review requested on PR #${PR_NUMBER}" \
            || echo "Note: Copilot reviewer request failed (may need Settings → Copilot → Code review enabled)"
