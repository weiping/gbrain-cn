name: Copilot Review on Push

on:
  push:
    branches: [gbrain-cn]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot review if PR exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Find any open PR from gbrain-cn (to any base branch).
          # PRs are created manually; this workflow only triggers review on existing ones.
          PR_NUMBER=$(gh pr list \
            --repo "${REPO}" \
            --head gbrain-cn \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for gbrain-cn — skipping Copilot review."
            echo "Create a PR manually when ready for review."
            exit 0
          fi

          echo "Found PR #${PR_NUMBER}, requesting Copilot review..."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f "reviewers[]=copilot-pull-request-reviewer" \
            && echo "Copilot review requested on PR #${PR_NUMBER}" \
            || echo "Copilot reviewer request failed (HTTP 422 = feature not enabled or no active PR)"
