name: Copilot Auto Review

on:
  push:
    branches: [gbrain-cn]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Ensure PR exists and request Copilot review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          # ── 1. Find or create PR ──────────────────────────────────────
          PR_NUMBER=$(gh pr list \
            --head gbrain-cn \
            --base master \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            COMMIT_MSG=$(git log -1 --pretty=format '%s' HEAD)
            TITLE="${COMMIT_MSG:-feat(gbrain-cn): changes}"

            # Write body to file to avoid YAML/shell quoting issues
            cat > /tmp/pr_body.md << EOF
Auto-created for Copilot review.

- Commit: \`${COMMIT_SHA}\`
- Run: ${RUN_URL}
EOF

            PR_NUMBER=$(gh pr create \
              --base master \
              --head gbrain-cn \
              --title "${TITLE}" \
              --draft \
              --body-file /tmp/pr_body.md \
              --json number \
              --jq '.number')
            echo "Created PR #${PR_NUMBER}"
          else
            echo "PR #${PR_NUMBER} already exists"
          fi

          # ── 2. Request Copilot as reviewer ────────────────────────────
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f "reviewers[]=copilot-pull-request-reviewer" \
            && echo "Copilot review requested on PR #${PR_NUMBER}" \
            || echo "Copilot reviewer request failed — check Settings → Copilot → Code review"
