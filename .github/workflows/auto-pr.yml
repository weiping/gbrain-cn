name: Auto PR

# workflow_run only reads from the default branch — useless for feature branches.
# Use push directly so this file on gbrain-cn is executed as-is.

on:
  push:
    branches: [gbrain-cn]

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Create PR if not exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list \
            --head gbrain-cn \
            --base master \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists — skipping"
            exit 0
          fi

          COMMIT_MSG=$(git log -1 --pretty=format '%s' HEAD)
          PR_TITLE="${COMMIT_MSG:-feat(gbrain-cn): sync to master}"
          COMMIT_COUNT=$(git rev-list --count origin/master..HEAD 2>/dev/null || echo "?")

          gh pr create \
            --base master \
            --head gbrain-cn \
            --title "${PR_TITLE}" \
            --body "## Auto-generated PR

Pushed to **gbrain-cn** — PR created automatically.

- Commits ahead of master: ${COMMIT_COUNT}
- Commit: \`${{ github.sha }}\`
- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

### Checklist
- [ ] CI green
- [ ] CHANGELOG updated
- [ ] Ready for review"

          echo "PR created"
